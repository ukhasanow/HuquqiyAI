# Render.com bepul tierga deploy (Blueprint)
# render.com -> New + -> Blueprint -> shu repo'ni tanlang.
# ANTHROPIC_API_KEY va ADMIN_PASSWORD qiymatlari dashboard'da so'raladi.
services:
  - type: web
    name: huquqiyai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MODEL
        value: claude-sonnet-4-5
      # Gemini bepul tierda kvota LOYIHAGA bog'langan: har model uchun kuniga
      # 20 ta so'rov (GenerateRequestsPerDayPerProjectPerModel-FreeTier).
      # Yangi kalit yasash yordam bermaydi — kvota o'sha loyihanikidir.
      # Kvota tugasa boshqa modelga o'tish vaqtincha yechim beradi.
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      # Bepul zaxira — Gemini kvotasi tugagach ishga tushadi, OpenAI'dan oldin.
      # Model o'lchov bilan tanlangan: llama-3.3-70b json_schema'ni
      # qo'llab-quvvatlamaydi, qwen3.6-27b prompt hajmiga sig'maydi.
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # Oxirgi zaxira (pulli) — faqat bepul kvotalar tugagach chaqiriladi
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      # Ovozli javob (TTS). Yoqish uchun: gemini
      - key: TTS_PROVAYDER
        value: gemini
      - key: GEMINI_TTS_MODEL
        value: gemini-2.5-flash-preview-tts
      - key: GEMINI_TTS_OVOZ
        value: Kore
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # Botda /statistika ko'ra oladigan chat ID lar
      - key: TELEGRAM_ADMIN_IDLAR
        sync: false
      # Statistikani saqlash uchun tashqi ombor (Upstash Redis REST).
      # Berilmasa statistika har deploy'da noldan boshlanadi.
      - key: STATISTIKA_KV_URL
        sync: false
      - key: STATISTIKA_KV_TOKEN
        sync: false
      # Webhook manzili — Render xizmatning o'z hostini beradi (sxemasiz,
      # https:// config.py da qo'shiladi)
      - key: TELEGRAM_WEBHOOK_URL
        fromService:
          type: web
          name: huquqiyai
          property: host
      - key: PYTHON_VERSION
        value: 3.12.6
