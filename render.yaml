services:
  - type: web
    name: huquqiyai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: BAZAARLINK_API_KEY
        sync: false
      - key: MODEL
        value: claude-sonnet-4-5
      
      - key: GEMINI_MODEL
        value: gemini-3.5-flash,gemini-flash-latest
     
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b,openai/gpt-oss-20b
      
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-super-120b-a12b:free
      - key: BAZAARLINK_MODEL
        value: auto:free
      
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      
      - key: TTS_PROVAYDER
        value: gemini
      - key: GEMINI_TTS_MODEL
        value: gemini-2.5-flash-preview-tts
      - key: GEMINI_TTS_OVOZ
        value: Kore
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      
      - key: TELEGRAM_ADMIN_IDLAR
        sync: false
      
      - key: STATISTIKA_KV_URL
        sync: false
      - key: STATISTIKA_KV_TOKEN
        sync: false
      
      - key: TELEGRAM_WEBHOOK_URL
        fromService:
          type: web
          name: huquqiyai
          property: host
      - key: PYTHON_VERSION
        value: 3.12.6
