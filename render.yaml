# Render.com bepul tierga deploy (Blueprint)
# render.com -> New + -> Blueprint -> shu repo'ni tanlang.
# ANTHROPIC_API_KEY va ADMIN_PASSWORD qiymatlari dashboard'da so'raladi.
services:
  - type: web
    name: huquqiyai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MODEL
        value: claude-sonnet-4-5
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      # Ovozli javob (TTS). Yoqish uchun: gemini
      - key: TTS_PROVAYDER
        value: yoq
      - key: GEMINI_TTS_MODEL
        value: gemini-2.5-flash-preview-tts
      - key: GEMINI_TTS_OVOZ
        value: Kore
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # Webhook manzili — Render xizmatning o'z hostini beradi (sxemasiz,
      # https:// config.py da qo'shiladi)
      - key: TELEGRAM_WEBHOOK_URL
        fromService:
          type: web
          name: huquqiyai
          property: host
      - key: PYTHON_VERSION
        value: 3.12.6
